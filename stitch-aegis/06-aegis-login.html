<div class="absolute inset-0 flex items-center justify-center">

<!-- Login Form -->
<div class="bg-surface-container/70 backdrop-blur-xl border border-outline-variant/30 p-lg shadow-2xl">
<form class="space-y-lg" onsubmit="return false">
<!-- Identity Field -->
<div class="space-y-xs group">
<label class="font-label-caps text-label-caps text-on-surface-variant flex justify-between items-center">
<span>ALPHANUMERIC USER IDENTITY</span>

</label>
<div class="relative border-b border-outline-variant/50 glow-border transition-all duration-300">
<input class="w-full bg-transparent border-none px-0 py-base font-code-sm text-primary focus:ring-0 placeholder:text-on-surface-variant/30" placeholder="UID_XXXX_XXXX_XXXX" spellcheck="false" type="text"/>
</div>
</div>
<!-- Password/Key Field -->
<div class="space-y-xs group">
<label class="font-label-caps text-label-caps text-on-surface-variant flex justify-between items-center">
<span>ENCRYPTION KEY / PASS</span>
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 0;">key</span>
</label>
<div class="relative border-b border-outline-variant/50 glow-border transition-all duration-300">
<input class="w-full bg-transparent border-none px-0 py-base font-code-sm text-primary focus:ring-0 placeholder:text-on-surface-variant/30" placeholder="••••••••••••••••" type="password"/>

</div>

<!-- Micro-interaction Script -->
<script>
        // Simple interactive pulse on button hover
        const btn = document.querySelector('button[type="submit"]');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            btn.style.setProperty('--x', `${x}px`);
            btn.style.setProperty('--y', `${y}px`);
        });

        // Add subtle focus effect on input fields via JS if needed for older browsers
        const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-cyber-lime');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-cyber-lime');
            });
        });
    </script>
