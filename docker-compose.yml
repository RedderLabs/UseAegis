# Infraestructura local de desarrollo de Aegis.
#
# Levanta PostgreSQL (Auth / AuthSession del relay) y DragonflyDB (base para la cola de blobs
# sealed-sender con BullMQ, ver docs/ARQUITECTURA.md §4). Dragonfly es drop-in compatible con
# el protocolo Redis (habla RESP en :6379), así que BullMQ/ioredis se conectan con la misma
# REDIS_URL (redis://...) sin tocar código. BullMQ se conectará cuando entre la cola; por ahora
# Dragonfly queda listo y verificable.
#
# Uso:
#   docker compose up -d --wait aegis-db aegis-redis   # arranca y espera a "healthy"
#   docker compose down                                # para los contenedores (conserva volúmenes)
#   docker compose down -v                             # ...y borra los datos
#
# El relay invoca este archivo en su script `dev`, así que en desarrollo la infra se
# levanta sola al arrancar el servidor.

services:
  aegis-db:
    image: postgres:16-alpine
    container_name: aegis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_relay}
    ports:
      # Expuesto solo en loopback: la BBDD de dev nunca escucha en la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aegis-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_relay}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  aegis-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    container_name: aegis-dragonfly
    restart: unless-stopped
    # OJO memlock: Dragonfly recomienda `ulimits: memlock: -1`, pero fijar memlock a
    # "ilimitado" falla en LXC NO privilegiados (Proxmox): runc → "error setting rlimit
    # type 8: operation not permitted" (falta CAP_SYS_RESOURCE). No lo forzamos aquí:
    # Dragonfly arranca igual con el memlock por defecto (de sobra para dev/nodo). Para
    # exprimir rendimiento en un host dedicado, sube memlock en el host (VPS/Docker lo
    # permite; en LXC: `lxc.prlimit.memlock` en la config del contenedor en el host Proxmox).
    # --dir /data + snapshot: Dragonfly guarda un snapshot en /data al parar (grácil) y cada
    # 5 min, para que un reinicio no pierda los blobs en vuelo de la cola. (No usa appendonly;
    # su durabilidad es por snapshot.)
    command: ["--dir", "/data", "--dbfilename", "dump", "--snapshot_cron", "*/5 * * * *"]
    ports:
      # Solo loopback: Dragonfly nunca escucha en la red. Reusa REDIS_PORT (protocolo Redis).
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - aegis-dragonfly-data:/data
    # La imagen ya trae HEALTHCHECK propio (/usr/local/bin/healthcheck.sh: nc PING al puerto),
    # así que `docker compose up --wait` detecta "healthy" sin definirlo aquí.

  # --- Relay en Docker (nodo, opt-in perfil "node") -------------------------------------
  # Levanta el relay COMPILADO junto a aegis-db/aegis-dragonfly, con reinicio automático:
  #   docker compose --profile node up -d --build aegis-relay
  # En dev (Windows) NO se usa: allí el relay corre con `pnpm dev`. Solo entra con el perfil
  # "node". Alcanza la BBDD/Dragonfly por NOMBRE de servicio en la red interna de compose.
  aegis-relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    container_name: aegis-relay
    profiles: ["node"]
    restart: unless-stopped
    depends_on:
      aegis-db:
        condition: service_healthy
      aegis-dragonfly:
        condition: service_healthy
    environment:
      # Conexión por NOMBRE de servicio + puerto interno (no 127.0.0.1:15432, que sería el
      # propio contenedor). Reusa las credenciales del .env raíz (POSTGRES_*).
      DATABASE_URL: postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_dev_pw}@aegis-db:5432/${POSTGRES_DB:-aegis_relay}
      REDIS_URL: redis://aegis-dragonfly:6379
      HOST: 0.0.0.0
      PORT: "8443"
      LOG_LEVEL: info
      # CORS_ORIGINS: define aquí el/los origen(es) de la web (coma-separado) cuando la sirvas.
    ports:
      # Loopback del host, solo para probar con curl. En clearnet real irá detrás de Caddy (sin
      # este puerto público); Tor tampoco lo necesita (alcanza aegis-relay:8443 por la red interna).
      - "127.0.0.1:8443:8443"

  # --- Web (Next.js) en Docker (nodo, perfil "node") ------------------------------------
  # Sirve la app web compilada; la alcanzan Caddy (clearnet) y Tor (.onion) por la red interna
  # (aegis-web:3000). El cliente habla con el relay como /api RELATIVO (same-origin) → Caddy enruta
  # /api al relay. Las NEXT_PUBLIC_* se INCRUSTAN en build-time, por eso van como build args.
  aegis-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL de la .onion de la WEB, para el enlace "abre nuestra .onion" desde la puerta clearnet.
        # Se obtiene tras el 1er arranque de Tor (cat .../aegis-web/hostname) → ponla en el .env y
        # reconstruye: docker compose --profile node up -d --build aegis-web.
        NEXT_PUBLIC_WEB_ONION_URL: ${NEXT_PUBLIC_WEB_ONION_URL:-}
    container_name: aegis-web
    profiles: ["node"]
    restart: unless-stopped
    environment:
      # Red de seguridad: en el nodo Caddy intercepta /api antes que Next, pero si algún /api
      # llegara a Next, el rewrite lo manda al relay por la red interna (no a 127.0.0.1:8443).
      RELAY_ORIGIN: http://aegis-relay:8443
    depends_on:
      - aegis-relay

  # --- Tor: hidden services .onion (nodo, perfil "node") --------------------------------
  # DOS hidden services v3 (imagen mínima Alpine + tor, infra/tor):
  #   1) aegis-relay → API del relay directa (aegis-relay:8443), para clientes nativos/directos.
  #   2) aegis-web   → puerta .onion de la WEB → aegis-caddy:80 (Caddy sirve web + /api→relay).
  # Se persisten en el volumen aegis-tor-data → las .onion NO cambian entre reinicios. Direcciones:
  #   docker compose --profile node exec aegis-tor cat /var/lib/tor/aegis-relay/hostname
  #   docker compose --profile node exec aegis-tor cat /var/lib/tor/aegis-web/hostname
  aegis-tor:
    build:
      context: ./infra/tor
    container_name: aegis-tor
    profiles: ["node"]
    restart: unless-stopped
    # Depende de Caddy (la .onion de la web apunta a Caddy) y, transitivamente, del relay y la web.
    # El entrypoint resuelve aegis-relay y aegis-caddy a IP (Tor no acepta nombres en HiddenServicePort).
    depends_on:
      - aegis-caddy
    volumes:
      - ./infra/tor/torrc:/etc/tor/torrc:ro
      - aegis-tor-data:/var/lib/tor
    # SIN publish del SOCKS: el SocksPort ahora escucha solo en el loopback DEL contenedor
    # (elimina el warning "open proxy" de Tor y el acceso desde otros contenedores del bridge).
    # El hidden service alcanza aegis-relay:8443 por la red interna sin necesitar puertos. La
    # autocomprobación de la .onion se hace desde dentro (la imagen trae curl):
    #   docker compose --profile node exec aegis-tor \
    #     curl --socks5-hostname 127.0.0.1:9050 http://<tu-onion>/health

  # --- Caddy: reverse proxy de las dos puertas (nodo, perfil "node") --------------------
  # Sirve la WEB y enruta /api al RELAY bajo el MISMO origen (same-origin, sin CORS), por clearnet
  # (TLS) y por la .onion (HTTP en :80; Tor cifra). Config en infra/caddy/Caddyfile, parametrizada:
  #   WEB_DOMAIN/WEB_TLS      puerta clearnet de la WEB (def: aegis.local / internal autofirmado)
  #   RELAY_DOMAIN/RELAY_TLS  acceso directo al relay, solo debug (def: relay.aegis.local / internal)
  #   Producción: WEB_DOMAIN=aegis.app + WEB_TLS=tu-email → Let's Encrypt (DNS A → IP pública, 80/443).
  aegis-caddy:
    image: caddy:2-alpine
    container_name: aegis-caddy
    profiles: ["node"]
    restart: unless-stopped
    depends_on:
      - aegis-relay
      - aegis-web
    environment:
      # Caddy sustituye {$WEB_DOMAIN}/{$WEB_TLS}/{$RELAY_DOMAIN}/{$RELAY_TLS} en el Caddyfile.
      # Se leen del `.env` del nodo; si no están, quedan los defaults de pruebas locales.
      WEB_DOMAIN: ${WEB_DOMAIN:-aegis.local}
      WEB_TLS: ${WEB_TLS:-internal}
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.aegis.local}
      RELAY_TLS: ${RELAY_TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - aegis-caddy-data:/data
      - aegis-caddy-config:/config

  # --- Umami: analítica SOLO de la landing (opcional, opt-in) ---------------------------
  # Bajo el perfil `umami`, así NO arranca con el flujo normal del relay (infra:up solo nombra
  # aegis-db y aegis-dragonfly). Se levanta a mano para probar la analítica:
  #   docker compose --profile umami up -d --wait aegis-umami
  #   docker compose --profile umami down            # pararlo
  # Panel en http://localhost:13001 (login inicial admin / umami — cámbialo). Ahí creas el
  # website y copias su UUID a NEXT_PUBLIC_UMAMI_WEBSITE_ID.

  aegis-umami-db:
    image: postgres:16-alpine
    container_name: aegis-umami-db
    profiles: ["umami"]
    restart: unless-stopped
    # BBDD propia de Umami, AISLADA de la de auth (aegis-db). Sin puertos: solo la usa Umami
    # dentro de la red de compose, nunca escucha en el host.
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
      POSTGRES_DB: umami
    volumes:
      - aegis-umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  aegis-umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0
    container_name: aegis-umami
    profiles: ["umami"]
    restart: unless-stopped
    depends_on:
      aegis-umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:umami@aegis-umami-db:5432/umami
      # APP_SECRET solo de dev: cifra sesiones/hashes de Umami. Cámbialo en producción.
      APP_SECRET: aegis-umami-dev-secret-change-me
    ports:
      # Solo loopback. 13001 en el host → 3000 del contenedor (Umami escucha en 3000).
      - "127.0.0.1:${UMAMI_PORT:-13001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  aegis-db-data:
    name: aegis-db-data
  aegis-dragonfly-data:
    name: aegis-dragonfly-data
  aegis-tor-data:
    name: aegis-tor-data
  aegis-caddy-data:
    name: aegis-caddy-data
  aegis-caddy-config:
    name: aegis-caddy-config
  aegis-umami-db-data:
    name: aegis-umami-db-data
