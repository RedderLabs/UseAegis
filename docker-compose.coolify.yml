# Despliegue de PRODUCCIÓN en Coolify — puerta CLEARNET (VM-B, useaegis.app).
#
# Diferencias con docker-compose.yml (dev/nodo):
#   - NO hay `aegis-db`: el Postgres lo da Coolify como recurso aparte (mejores backups) →
#     el relay lo alcanza por DATABASE_URL (variable de entorno en Coolify).
#   - NO hay Caddy: el TLS + el dominio los pone Traefik de Coolify (Let's Encrypt). La web
#     reenvía `/api` → relay por la red interna (next.config `rewrites`, vía RELAY_ORIGIN),
#     así que el modelo same-origin se mantiene SIN reverse-proxy propio.
#   - NO hay Tor: esta es la puerta clearnet. La .onion va en la otra VM (fase posterior).
#
# En Coolify: Nuevo recurso → Docker Compose → este archivo. Asigna el dominio useaegis.app al
# servicio `web` (puerto 3000). El `relay` queda interno (sin dominio). Variables → panel de Coolify.
#
# ⚠️ Las S3_* de media (audio/archivos) son claves de PRUEBA hoy: ROTA a claves de prod y ponlas
# como variables en Coolify (no en el repo).

services:
  # --- Relay (Fastify + Postgres) --------------------------------------------------------
  # Interno: no publica dominio. La web lo alcanza por el nombre de servicio `relay:8443` en la
  # red interna del compose. Aplica migraciones al arrancar (crea el esquema en un Postgres vacío).
  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    # Contención: ningún contenedor puede agotar la RAM/CPU del host (OOM) ni forkear sin límite.
    # Ajustables según el hierro; estos valores dejan holgura de sobra para Node/Fastify.
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    # Rotación de logs: evita que un flood llene el disco (otra vía de DoS).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Connection string INTERNO del Postgres de Coolify (cópialo del recurso Postgres).
      DATABASE_URL: ${DATABASE_URL}
      # DragonflyDB (Redis-compatible) para el pub/sub del push en tiempo real (SSE). Cópialo del
      # recurso Dragonfly de Coolify (p. ej. redis://default:PASS@dragonfly:6379). OPCIONAL: sin él,
      # los avisos SSE funcionan solo en proceso (correcto con una única instancia del relay).
      REDIS_URL: ${REDIS_URL:-}
      HOST: 0.0.0.0
      PORT: "8443"
      LOG_LEVEL: info
      # TTL de sobres y de objetos de media (por defecto 30 días).
      BLOB_TTL_SECONDS: ${BLOB_TTL_SECONDS:-2592000}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-2592000}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-52428800}
      # Cuota de almacenamiento por identidad (bytes en reposo), madura con la edad de la cuenta.
      # Imprescindible en el relay público: sin ella, una identidad puede subir ~8 TiB/día.
      QUOTA_BASE_BYTES: ${QUOTA_BASE_BYTES:-104857600}
      QUOTA_MAX_BYTES: ${QUOTA_MAX_BYTES:-1073741824}
      QUOTA_RAMP_DAYS: ${QUOTA_RAMP_DAYS:-30}
      QUOTA_DAILY_MIN_BYTES: ${QUOTA_DAILY_MIN_BYTES:-104857600}
      # Almacén de objetos S3/B2 para adjuntos cifrados (audio/archivos). Sin estas 5, /media = 503.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    expose:
      - "8443"

  # --- Web (Next.js) ---------------------------------------------------------------------
  # Público: asígnale el dominio useaegis.app en Coolify (puerto 3000). Reenvía /api → relay.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vacío en clearnet-only. Cuando exista la .onion de la web, ponla aquí y redeploya
        # (se incrusta en build-time para el enlace "abre nuestra .onion").
        NEXT_PUBLIC_WEB_ONION_URL: ${NEXT_PUBLIC_WEB_ONION_URL:-}
        # BUILD-TIME: Next congela el rewrite /api→relay en el build (no en runtime). Sin Caddy
        # delante (caso Coolify), este rewrite ES el proxy, así que el destino debe hornearse aquí.
        RELAY_ORIGIN: ${RELAY_ORIGIN:-http://relay:8443}
        # Umami (analítica de la landing) — NEXT_PUBLIC_* build-time. Vacías = sin analítica.
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        # Modo B (libp2p, Fase 3) — multiaddr del bootstrap (D2), coma-separado. BUILD-TIME: se
        # incrusta en el bundle. VACÍO = el chat queda solo relay (idéntico a hoy). Tras el 1er
        # deploy del servicio p2p-bootstrap, saca su PeerID de los logs, forma el multiaddr
        # /dns4/<P2P_DOMAIN>/tcp/443/wss/p2p/<PeerID>, ponlo aquí (panel de Coolify) y REDEPLOY web.
        NEXT_PUBLIC_P2P_BOOTSTRAP: ${NEXT_PUBLIC_P2P_BOOTSTRAP:-}
        # Modo B por la puerta .onion: el circuit-relay se sirve como puerto virtual (9001) sobre la
        # MISMA onion de la web (ver infra/tor/torrc.coolify). Tras sacar el PeerID del bootstrap y la
        # dirección .onion de la web, forma  /dns4/<web-onion>.onion/tcp/9001/ws/p2p/<PeerID>,
        # ponlo aquí (panel de Coolify) y REDEPLOY web. VACÍO = sobre Tor el chat queda solo relay.
        NEXT_PUBLIC_P2P_BOOTSTRAP_ONION: ${NEXT_PUBLIC_P2P_BOOTSTRAP_ONION:-}
        # ICE del WebRTC (Fase 4) — solo clearnet; sobre Tor no hay WebRTC. Sin ICE, el Modo B solo
        # atraviesa NAT permisiva (el límite honesto que quedó abierto al cerrar la Fase 3). Autoaloja
        # coturn y apúntalo aquí: no se usa STUN público de terceros por defecto.
        NEXT_PUBLIC_P2P_ICE_SERVERS: ${NEXT_PUBLIC_P2P_ICE_SERVERS:-}
        NEXT_PUBLIC_P2P_TURN_USER: ${NEXT_PUBLIC_P2P_TURN_USER:-}
        NEXT_PUBLIC_P2P_TURN_CREDENTIAL: ${NEXT_PUBLIC_P2P_TURN_CREDENTIAL:-}
    restart: unless-stopped
    # Contención (ver relay). Next en runtime es ligero, pero puede picar bajo carga → 1 GiB de tope.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # La web (server-side) reenvía /api/* al relay por la red interna. El navegador solo habla
      # con useaegis.app → same-origin, sin CORS.
      RELAY_ORIGIN: http://relay:8443
    depends_on:
      - relay
    expose:
      - "3000"

  # --- Tor: puerta .onion de la WEB (opcional, misma VM) ---------------------------------
  # Hidden service v3 saliente: se conecta a la red Tor, NO abre puerto entrante (cero superficie
  # de ataque nueva). La onion de la web apunta a `web:3000` (Next sirve la web y reenvía /api→relay
  # same-origin; aquí NO hay Caddy). También publica la onion DIRECTA del relay (relay:8443) para
  # clientes nativos. Las claves viven en el volumen `aegis-tor-data` → la dirección .onion NO
  # cambia entre despliegues. Ver docs/aegis-coolify-deploy.md §9.
  #
  # Tras el 1er deploy, saca la dirección y hornéala en el enlace "abre nuestra .onion":
  #   docker compose exec tor cat /var/lib/tor/aegis-web/hostname
  #   → pon ese valor en NEXT_PUBLIC_WEB_ONION_URL (panel de Coolify) y REDEPLOY.
  #
  # Si NO quieres la puerta .onion, borra este servicio (y su volumen): web/relay siguen igual.
  tor:
    build:
      context: ./infra/tor
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    # Contención (ver relay). Tor es ligero; un tope bajo basta y evita que un intro-flood
    # que agote memoria en el proceso Tor arrastre al host.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - web
    volumes:
      - aegis-tor-data:/var/lib/tor

  # --- P2P bootstrap + circuit-relay v2 (Modo B / Fase 3, decisión D2) --------------------
  # Punto de entrada a la red libp2p Y relay de circuito (señalización del WebRTC navegador↔
  # navegador). Solo WebSockets: el WebRTC lo ponen los navegadores. En Coolify NO hay Caddy →
  # asígnale un dominio propio (p. ej. p2p.useaegis.app) al puerto 9001: el Traefik de Coolify
  # termina TLS (wss) y hace el upgrade WebSocket automáticamente. WebRTC NO viaja por Tor: esta
  # es una puerta CLEARNET (anti-censura del relay), no una .onion. Ver docs/aegis-fase3-libp2p-spike.md §3.5.
  #
  # PeerID ESTABLE: la semilla se persiste en el volumen aegis-p2p-bootstrap-data (o fíjala con
  # P2P_BOOTSTRAP_SEED, 32 bytes hex). Tras el 1er deploy, saca el PeerID de los logs:
  #   docker compose logs p2p-bootstrap | grep PeerID
  # forma el multiaddr /dns4/p2p.useaegis.app/tcp/443/wss/p2p/<PeerID>, ponlo en
  # NEXT_PUBLIC_P2P_BOOTSTRAP (panel de Coolify) y REDEPLOY el servicio web.
  p2p-bootstrap:
    build:
      context: ./infra/p2p-bootstrap
    restart: unless-stopped
    # Contención (ver relay). WS + relay de circuito son ligeros; un tope bajo basta.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      WS_PORT: "9001"
      # OPCIONAL: fija el PeerID entre despliegues/hosts (32 bytes hex). Si se omite, se genera y
      # se persiste en el volumen (estable mientras el volumen exista).
      P2P_BOOTSTRAP_SEED: ${P2P_BOOTSTRAP_SEED:-}
    expose:
      - "9001"
    volumes:
      - aegis-p2p-bootstrap-data:/data

  # --- coturn: STUN/TURN del WebRTC (Modo B / Fase 4) ------------------------------------
  # Sin ICE, el Modo B solo atraviesa NAT permisiva (ambos navegadores en la MISMA red): es el
  # límite honesto que quedó abierto al cerrar la Fase 3. Con este STUN/TURN propio atraviesa NAT
  # entre redes distintas. Se autoaloja A PROPÓSITO: un STUN público de terceros vería la IP de
  # cada usuario que arranca el Modo B. Aquí esa IP la ve un servidor que YA es nuestro.
  #
  # NO lleva dominio en Coolify: Traefik solo proxea HTTP/TCP y el grueso de TURN es UDP. Publica
  # sus puertos DIRECTAMENTE en el host → hay que abrirlos en el cortafuegos (ufw, ver §3 del doc).
  #
  # Tras el 1er deploy, apunta el cliente a él y REDEPLOY web (son build-time):
  #   NEXT_PUBLIC_P2P_ICE_SERVERS=stun:turn.useaegis.app:3478,turn:turn.useaegis.app:3478
  #   NEXT_PUBLIC_P2P_TURN_USER / NEXT_PUBLIC_P2P_TURN_CREDENTIAL = TURN_USER / TURN_PASSWORD
  # Ver docs/aegis-coturn-deploy.md. Si NO quieres TURN, no actives el perfil: web/relay siguen
  # igual y el Modo B se queda como hoy (NAT permisiva) — el failover a Modo A no depende de esto.
  #
  # APAGADO POR DEFECTO (perfil `turn`), y esto no es cosmética: el entrypoint aborta a propósito
  # si faltan TURN_USER / TURN_PASSWORD / TURN_EXTERNAL_IP (un TURN sin credenciales es ancho de
  # banda gratis para cualquiera). Con `restart: unless-stopped` eso es un bucle de reinicio, y
  # Coolify, al pasarse de `max_restart_count`, se lleva por delante la APLICACIÓN ENTERA — web
  # incluida. Es lo que tumbó useaegis.app cada ~2 h desde que el servicio entró en el compose
  # (16/08/2026). Para encenderlo: rellena las tres variables en el panel y despliega con
  # COMPOSE_PROFILES=turn.
  coturn:
    profiles: ["turn"]
    build:
      context: ./infra/coturn
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    # Contención (ver relay). coturn es un reenviador de paquetes: ligero en RAM, sin forks.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # OBLIGATORIA: IP pública IPv4 del host. En Docker hay NAT 1:1 y sin esto los candidatos
      # ICE salen con la IP interna del contenedor (172.x) — inservibles desde fuera.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      # OBLIGATORIAS: sin credenciales el entrypoint aborta (un TURN abierto es un relevo gratis).
      TURN_USER: ${TURN_USER}
      TURN_PASSWORD: ${TURN_PASSWORD}
      TURN_REALM: ${TURN_REALM:-useaegis.app}
    ports:
      # Puertos de control STUN/TURN.
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # TLS (turns:). Solo escucha si se monta certificado; publicarlo igualmente no abre nada.
      - "5349:5349/tcp"
      # Rango de relevo, ESTRECHO a propósito: cada puerto publicado levanta su propio
      # docker-proxy. Debe coincidir con min-port/max-port de turnserver.conf.template.
      - "49160-49200:49160-49200/udp"
    # OPCIONAL — turns:5349. Monta un certificado válido para el dominio del TURN y descomenta.
    # Sin él arranca solo turn:3478, que basta: el payload ya va cifrado E2E por encima.
    # volumes:
    #   - /ruta/al/certificado:/etc/coturn/certs:ro

volumes:
  # Persiste las claves de las .onion (hs_ed25519_secret_key) → dirección estable entre deploys.
  aegis-tor-data:
  # Persiste la semilla del PeerID del bootstrap → multiaddr estable entre deploys.
  aegis-p2p-bootstrap-data:
